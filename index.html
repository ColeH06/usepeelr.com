<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Peelr — We'll Be Back Soon</title>

  <link rel="icon" href="/static/icons/favicon-32.png" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d; /* dark charcoal */
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .container {
      max-width: 600px;
      padding: 20px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top-left logo */
    .logo {
      position: absolute;
      top: 32px;     /* more breathing room */
      left: 32px;
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 60px;  /* bigger, more visible */
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
    }

    h1 {
      font-size: 42px;
      margin-bottom: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    p {
      font-size: 18px;
      color: #bbbbbb;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .subtext {
      font-size: 15px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="/static/peelr-logo.png" alt="Peelr Logo">
  </div>

  <div class="container">
    <h1>We're Upgrading Peelr</h1>
    <p>Something new is coming.<br>We’ll be back soon.</p>
  </div>

</body>
</html>
